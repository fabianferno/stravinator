# Local end-to-end stack: MongoDB + the render worker.
#
# No secrets live in this file. Everything sensitive is read from your shell or
# a local .env (which is gitignored):
#
#   cp .env.example .env && $EDITOR .env
#   docker compose up --build
#
# The app itself still runs on the host (`npm run dev`); the worker reaches it
# via host.docker.internal.
services:
  mongo:
    image: mongo:7
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      # Inside the compose network Mongo is reachable by service name on 27017.
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/stravinator}
      APP_URL: ${APP_URL:-http://host.docker.internal:3000}
      WORK_DIR: /data
      # Required, no default: must match the app's WORKER_TOKEN.
      WORKER_TOKEN: ${WORKER_TOKEN:?set WORKER_TOKEN in your environment or .env}
      NEXT_PUBLIC_CESIUM_ION_TOKEN: ${NEXT_PUBLIC_CESIUM_ION_TOKEN:-}
      WORKER_ID: ${WORKER_ID:-compose-worker}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Tile cache and rendered output. Tiles bill per request — keep this.
      - workerdata:/data
    restart: unless-stopped

volumes:
  mongodata:
  workerdata:
